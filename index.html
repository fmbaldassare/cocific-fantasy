    const box=el('div','card');
    box.innerHTML = `<div class="k" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px">Not started</div>
      <div style="font-size:14px">${cur.teamCount} teams, ${cur.regEnd} regular-season weeks, top ${f.spots} make the playoffs.
      Standings, weekly results and the odds below all come to life once week 1 is played.</div>`;
    p.appendChild(box);
  } else {
    p.appendChild(el('h3',null,`Standings after week ${f.weeksPlayed}`));
    const rec={};
    cur.weeks.filter(w=>!w.isPlayoff).forEach(w=>w.games.forEach(g=>{
      const A=cur.byRoster[g.a.rosterId], B=cur.byRoster[g.b.rosterId];
      if(!A||!B) return;
      [[A,g.a.points,g.b.points],[B,g.b.points,g.a.points]].forEach(([t,pf,pa])=>{
        const r=rec[t.manager]=rec[t.manager]||{w:0,l:0,t:0,pf:0,pa:0,n:0};
        r.pf+=pf; r.pa+=pa; r.n++;
        if(pf>pa) r.w++; else if(pf<pa) r.l++; else r.t++;
      });
    }));
    const rows=Object.entries(rec).map(([m,r])=>({m,...r}))
      .sort((a,b)=>b.w-a.w || b.pf-a.pf);
    const t=el('table');
    t.innerHTML='<thead><tr><th></th><th>Manager</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>PPG</th></tr></thead>';
    const tb=el('tbody');
    rows.forEach((r,i)=>{
      const inPo = i < f.spots;
      tb.innerHTML+=`<tr><td class="rank">${i+1}</td>
        <td class="name">${esc(r.m)}${inPo?' <span class="tag sleeper">PO</span>':''}</td>
        <td class="num">${r.w}</td><td class="num">${r.l}</td>
        <td class="num">${fmt(r.pf)}</td><td class="num">${fmt(r.pa)}</td>
        <td class="num">${fmt(r.pf/r.n)}</td></tr>`;
    });
    t.appendChild(tb); wrapT(p,t);

    /* ---- last week ---- */
    const lw = cur.weeks.filter(w=>!w.isPlayoff).pop();
    if(lw){
      p.appendChild(el('h3',null,`Week ${lw.week} results`));
      const ranked=lw.allScores.slice().sort((a,b)=>b.points-a.points);
      const rankOf={}; ranked.forEach((x,i)=>rankOf[x.rosterId]=i+1);
      lw.games.forEach(g=>{
        const A=cur.byRoster[g.a.rosterId], B=cur.byRoster[g.b.rosterId]; if(!A||!B) return;
        const aw=g.a.points>g.b.points, bw=g.b.points>g.a.points;
        const d=el('div','game');
        d.innerHTML=`
          <div class="side"><span class="tm ${aw?'w':''}">${esc(A.manager)}</span>
            <span class="muted small">#${rankOf[A.rosterId]} this week</span></div>
          <div style="text-align:center"><div class="sc"><span class="${aw?'w':''}">${fmt(g.a.points)}</span> <span class="vs">—</span> <span class="${bw?'w':''}">${fmt(g.b.points)}</span></div></div>
          <div class="side r"><span class="tm ${bw?'w':''}">${esc(B.manager)}</span>
            <span class="muted small">#${rankOf[B.rosterId]} this week</span></div>`;
        p.appendChild(d);
      });
    }
  }

  /* ---- trash talk ---- */
  renderTrash(p, trashSeason(f), 'Trash talk');

  /* ---- playoff odds ---- */
  p.appendChild(el('h2',null,'Playoff odds'));
  const state = f.weeksPlayed === 0
    ? `No games played yet. Every team starts at the league average of ${fmt(f.lgMean)} points per week, so these odds are driven only by the schedule and come out close to even by design. They start moving after week 1.`
    : `${f.weeksPlayed} week${f.weeksPlayed===1?'':'s'} played, ${f.weeksLeft} to go. ${f.sims.toLocaleString()} simulated seasons. Top ${f.spots} make the playoffs.`;
  p.appendChild(el('div','small muted',state));

  const t2=el('table');
  t2.innerHTML='<thead><tr><th></th><th>Manager</th><th>Record</th><th>PPG</th><th>Proj. wins</th><th>Avg seed</th><th>Top seed</th><th>Playoff odds</th></tr></thead>';
  const tb2=el('tbody');
  f.rows.forEach((r,i)=>{
    const pct=(r.odds*100);
    const cls = pct>=75?'pos' : pct<=25?'neg' : '';
    const losses = r.games - r.wins;
    tb2.innerHTML+=`<tr>
      <td class="rank">${i+1}</td>
      <td class="name">${esc(r.manager)}<div class="muted small">${esc(r.teamName)}</div></td>
      <td class="num">${r.games?`${r.wins}-${losses}`:'—'}</td>
      <td class="num">${r.ppg===null?'—':fmt(r.ppg)}</td>
      <td class="num">${fmt(r.projWins)}</td>
      <td class="num muted">${fmt(r.seed)}</td>
      <td class="num muted">${(r.top*100).toFixed(0)}%</td>
      <td class="num">
        <div class="oddsbar"><span style="width:${Math.max(pct,1.5)}%"></span></div>
        <span class="${cls}">${pct.toFixed(1)}%</span>
      </td></tr>`;
  });
  t2.appendChild(tb2); wrapT(p,t2);

  p.appendChild(el('h3',null,'How the odds work'));
  const m=el('div','card small muted');
  m.innerHTML = `
    <p style="margin-top:0">Each team's weekly score is drawn from a normal distribution: its own mean, and a league-wide standard deviation of <b style="color:var(--paper)">${fmt(f.lgSD)}</b> points measured across every completed Sleeper season. The remaining schedule is the real one, so a hard run of opponents shows up in the odds without being modelled separately.</p>
    <p>A team's projected mean is not its raw average. Points per game is the best single predictor available, but unreliable over a handful of games, so the average is pulled toward the league mean of <b style="color:var(--paper)">${fmt(f.lgMean)}</b> — weighted as if the league average were ${f.K} extra games on the schedule. After three weeks a team is still mostly league-average; by week ten its own scoring dominates.</p>
    <p style="margin-bottom:0">Not modelled: individual players, injuries, bye weeks, trades, or how good the draft was. These numbers are worth reading from about week 4 onward.</p>`;
  p.appendChild(m);
}

function renderRecords(){
  const p=$('#p-records'); p.innerHTML='';
  const r=STATE.records;
  p.appendChild(el('h2',null,'The record book'));
  if(!r.high) p.appendChild(el('div','empty','Weekly records need score data from Sleeper seasons.'));
  const when=x=>`${x.season} week ${x.week}`;
  const group=(title, r, note)=>{
    if(!r || !r.high) return;
    p.appendChild(el('h3',null,title));
    p.appendChild(el('div','small muted',(note?note+' ':'')+'Sleeper seasons only (2020 onward) \u2014 the NFL.com years were recorded as final standings, without weekly scores.'));
    const g=el('div','grid');
    const card=(k,v,who,w2)=>{
      const c=el('div','card stat');
      c.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div><div class="who">${esc(who)}</div><div class="when">${esc(w2)}</div>`;
      g.appendChild(c);
    };
    card('Highest score', fmt(r.high.points), r.high.who, when(r.high));
    card('Lowest score', fmt(r.low.points), r.low.who, when(r.low));
    card('Biggest blowout', fmt(r.blowout.margin), `${r.blowout.win} over ${r.blowout.lose} (${fmt(r.blowout.ws)}–${fmt(r.blowout.ls)})`, when(r.blowout));
    card('Closest game', fmt(r.close.margin,2), `${r.close.win} over ${r.close.lose}`, when(r.close));
    card('Highest-scoring loss', fmt(r.highLoss.points), `${r.highLoss.who}, beaten by ${r.highLoss.beatBy}`, when(r.highLoss));
    card('Lowest-scoring win', fmt(r.lowWin.points), r.lowWin.who, when(r.lowWin));
    card('Highest combined', fmt(r.combo.total), `${r.combo.a} vs ${r.combo.b}`, when(r.combo));
    p.appendChild(g);
  };

  group('Regular season', STATE.recReg);
  group('Championship playoffs', STATE.recPost, 'Games between qualified teams only. Consolation-bracket results are kept separate, below.');

  const rows=Object.values(STATE.managers).filter(m=>m.best).sort((a,b)=>b.best.points-a.best.points);
  if(rows.length) p.appendChild(el('h2',null,'Best single week, by manager'));
  if(rows.length) p.appendChild(el('div','small muted','Regular season, Sleeper seasons only (2020 onward).'));
  const t=el('table');
  t.innerHTML='<thead><tr><th></th><th>Manager</th><th>Points</th><th>When</th></tr></thead>';
  const tb=el('tbody');
  rows.forEach((m,i)=>{
    tb.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(m.name)}</td>
      <td class="num">${fmt(m.best.points)}</td><td class="num muted">${m.best.season} wk ${m.best.week}</td></tr>`;
  });
  t.appendChild(tb); p.appendChild(t);

  // ---- scoring extremes ----
  const scorers = Object.values(STATE.managers)
    .filter(m => (m.wins+m.losses+m.ties) > 0 && m.ppg > 0 && m.scoreIndex !== null)
    .sort((a,b)=>b.scoreIndex-a.scoreIndex);
  if(scorers.length >= 2){
    p.appendChild(el('h2',null,'Scoring, best and worst'));
    p.appendChild(el('div','small muted','Ranked by Score+ — scoring relative to each season\'s league average, where 100 is average. Raw PPG is shown too, but it is not comparable across seasons: the league has used half PPR, full PPR and whatever the NFL.com years ran, and a full-PPR season inflates every score in it.'));
    const wrap=el('div','grid grid-wide');
    const mkList=(title, list, cls)=>{
      const c=el('div','card');
      c.appendChild(el('h3',null,title));
      const tt=el('table');
      tt.innerHTML='<thead><tr><th></th><th>Manager</th><th>Score+</th><th>PPG</th><th>Yrs</th></tr></thead>';
      const tbb=el('tbody');
      list.forEach((m,i)=>{
        tbb.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(m.name)}</td>
          <td class="num ${cls}">${m.scoreIndex.toFixed(0)}</td>
          <td class="num muted">${fmt(m.ppg)}</td><td class="num muted">${m.seasons}</td></tr>`;
      });
      tt.appendChild(tbb); c.appendChild(tt);
      wrap.appendChild(c);
    };
    mkList('Top 3 — scoring', scorers.slice(0,3), 'cons');
    mkList('Bottom 3 — scoring', scorers.slice(-3).reverse(), 'shame-last');
    p.appendChild(wrap);
  }

  // ---- postseason ----
  p.appendChild(el('h2',null,'Postseason'));
  const fields = [...new Set(STATE.seasons.filter(s=>s.playoffTeamCount).map(s=>s.playoffTeamCount))];
  let fieldNote = '';
  if(fields.length > 1){
    const byField = {};
    STATE.seasons.filter(s=>s.playoffTeamCount).forEach(s => (byField[s.playoffTeamCount]=byField[s.playoffTeamCount]||[]).push(s.season));
    fieldNote = ' The playoff field has not been constant — '
      + Object.entries(byField).sort((a,b)=>a[0]-b[0])
          .map(([n,yrs])=>`${n} spots in ${yrs.join(', ')}`).join('; ')
      + '. Making the playoffs in a 4-team field was a harder thing to do than in a 6-team one, so raw appearance counts favour recent seasons.';
  }
  p.appendChild(el('div','small muted','Playoff appearances and podium finishes. Playoff counts come from the championship bracket, so they only cover seasons where one was played.' + fieldNote));
  const post = Object.values(STATE.managers)
    .filter(m => m.playoffs || m.titles || m.seconds || m.thirds)
    .sort((a,b)=> b.titles-a.titles || b.seconds-a.seconds || b.thirds-a.thirds || b.playoffs-a.playoffs);
  if(!post.length){
    p.appendChild(el('div','empty','No completed brackets yet.'));
  } else {
    const tp=el('table');
    tp.innerHTML='<thead><tr><th></th><th>Manager</th><th>Playoffs</th><th>1st</th><th>2nd</th><th>3rd</th><th>Podium</th></tr></thead>';
    const tbp=el('tbody');
    post.forEach((m,i)=>{
      const podium=m.titles+m.seconds+m.thirds;
      tbp.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(m.name)}</td>
        <td class="num">${m.playoffs||''}</td>
        <td class="num champ">${m.titles||''}</td>
        <td class="num">${m.seconds||''}</td>
        <td class="num">${m.thirds||''}</td>
        <td class="num">${podium||''}</td></tr>`;
    });
    tp.appendChild(tbp); wrapT(p,tp);

    const never = Object.values(STATE.managers).filter(m => !m.playoffs && m.seasons);
    if(never.length){
      p.appendChild(el('div','small muted','Never made the playoffs: ' + never.map(m=>esc(m.name)).join(' &middot; ')));
    }
  }

  // ---- consolation bracket ----
  const cons = STATE.seasons.filter(s=>s.consolationWinner || (s.consolationPending||[]).length)
                            .sort((a,b)=>b.season-a.season);
  if(cons.length){
    p.appendChild(el('h2',null,'Consolation bracket'));
    p.appendChild(el('div','small muted','Winners of the losers bracket — the best of the teams that missed the playoffs.'));
    const t3=el('table');
    t3.innerHTML='<thead><tr><th>Season</th><th>Consolation winner</th><th>Beat</th></tr></thead>';
    const tb3=el('tbody');
    cons.forEach(s=>{
      if(s.consolationWinner){
        tb3.innerHTML+=`<tr><td class="name num">${s.season}</td>
          <td style="text-align:right" class="cons">${esc(s.consolationWinner)}</td>
          <td class="muted">${esc(s.consolationRunnerUp||'—')}</td></tr>`;
      } else {
        tb3.innerHTML+=`<tr><td class="name num">${s.season}</td>
          <td style="text-align:right" class="muted">final never played</td>
          <td class="muted">${esc(s.consolationPending.join(' v '))}</td></tr>`;
      }
    });
    t3.appendChild(tb3); p.appendChild(t3);

    const multi = Object.values(STATE.managers).filter(m=>m.consolations>1)
      .sort((a,b)=>b.consolations-a.consolations);
    if(multi.length){
      p.appendChild(el('div','small muted','Multiple consolation titles: '
        + multi.map(m=>`${esc(m.name)} (${m.consolations})`).join(', ')));
    }

    const c = STATE.recCons;
    if(c && c.high){
      p.appendChild(el('div','small muted','Consolation records live down here rather than in the record book. In 2020 the bracket reached its final and simply was never played, which tells you everything about how much this trophy is worth.'));
      const cg=el('div','grid');
      const card=(k,v,who,when)=>{
        const box=el('div','card stat');
        box.innerHTML=`<div class="k">${k}</div><div class="v">${v}</div><div class="who">${esc(who)}</div><div class="when">${esc(when)}</div>`;
        cg.appendChild(box);
      };
      const when=x=>`${x.season} week ${x.week}`;
      card('Highest score', fmt(c.high.points), c.high.who, when(c.high));
      card('Lowest score', fmt(c.low.points), c.low.who, when(c.low));
      if(c.blowout) card('Biggest blowout', fmt(c.blowout.margin),
        `${c.blowout.win} over ${c.blowout.lose}`, when(c.blowout));
      p.appendChild(cg);
    }
  }
}

function renderDrafts(){
  const p=$('#p-drafts'); p.innerHTML='';
  const ds=STATE.seasons.filter(s=>s.draft.length).sort((a,b)=>b.season-a.season);
  if(!ds.length){ p.appendChild(el('div','empty','No draft data yet. Sleeper drafts appear here once a draft completes.')); return; }
  const ctr=el('div','controls'); const sel=el('select');
  ds.forEach(s=>{const o=el('option',null,String(s.season)); o.value=s.season; sel.appendChild(o);});
  ctr.appendChild(sel); p.appendChild(ctr);
  const box=el('div'); p.appendChild(box);
  const draw=()=>{
    const s=ds.find(x=>x.season===+sel.value); box.innerHTML='';
    box.appendChild(el('h2',null,`${s.season} draft`));
    const t=el('table');
    t.innerHTML='<thead><tr><th>Pick</th><th>Manager</th><th>Player</th><th>Pos</th><th>Team</th></tr></thead>';
    const tb=el('tbody');
    s.draft.slice().sort((a,b)=>a.pick-b.pick).forEach(pk=>{
      tb.innerHTML+=`<tr><td class="rank">${pk.round}.${String(pk.pick).padStart(2,'0')}</td>
        <td class="name">${esc(pk.manager)}</td><td style="text-align:right">${esc(pk.player)}</td>
        <td class="num muted">${esc(pk.position)}</td><td class="num muted">${esc(pk.team)}</td></tr>`;
    });
    t.appendChild(tb); wrapT(box,t);
  };
  sel.addEventListener('change',draw); draw();
}

function renderData(){
  const p=$('#p-data'); p.innerHTML='';
  p.appendChild(el('h2',null,'What is loaded'));
  const t=el('table');
  t.innerHTML='<thead><tr><th>Season</th><th>Source</th><th>Teams</th><th>Playoff spots</th><th>Scoring</th><th>Weeks</th><th>Draft picks</th><th>Champion</th></tr></thead>';
  const tb=el('tbody');
  STATE.allSeasons.slice().sort((a,b)=>b.season-a.season).forEach(s=>{
    tb.innerHTML+=`<tr><td class="name num">${s.season}</td><td style="text-align:right">${s.source==='sleeper'?'sleeper':'NFL.com'}</td>
      <td class="num">${s.teamCount}</td>
      <td class="num">${s.playoffTeamCount||'—'}</td>
      <td class="num muted small">${esc(s.scoring||'—')}</td>
      <td class="num">${s.weeks.length}</td>
      <td class="num">${s.draft.length}</td><td>${esc(s.champion||'—')}</td></tr>`;
  });
  const now=new Date().getFullYear();
  for(let y=CONFIG.firstSeason;y<=now;y++){
    if(!STATE.allSeasons.find(s=>s.season===y))
      tb.innerHTML+=`<tr><td class="name num" style="color:var(--ghost)">${y}</td><td colspan="7" class="muted" style="text-align:right">not recovered</td></tr>`;
  }
  t.appendChild(tb); wrapT(p,t);

}

/* ---------- tabs ---------- */
/* ---------- header from config ---------- */
$('#eyebrow').textContent = CONFIG.eyebrow;
$('#tagline').textContent = CONFIG.tagline;
if(CONFIG.logo){
  const lg=$('#logo');
  lg.src=CONFIG.logo; lg.alt=CONFIG.leagueName+' logo'; lg.hidden=false;
  lg.addEventListener('error',()=>{ lg.hidden=true; console.warn('Logo not found:',CONFIG.logo); });
}

/* ---------- tabs ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    $('#p-'+b.dataset.p).classList.add('on');
  });
});

/* ---------- recompute everything for the selected seasons ---------- */
function recompute(){
  STATE.seasons  = STATE.allSeasons.filter(s => STATE.selected.has(s.season));
  STATE.managers = buildManagers(STATE.seasons);
  STATE.h2h      = buildH2H(STATE.seasons);
  STATE.rivalries= buildRivalries(STATE.seasons);
  STATE.records  = buildRecords(STATE.seasons,'all');
  STATE.recReg   = buildRecords(STATE.seasons,'reg');
  STATE.recPost  = buildRecords(STATE.seasons,'post');
  STATE.shame    = buildShame(STATE.seasons);

  renderStrip(); renderOverview(); renderSeasons(); renderMatchups();
  renderAllTime(); renderH2H(); renderRecords(); renderForecast();
  renderShame(); renderDrafts(); renderData();
}

/* ---------- boot ---------- */
(async function(){
  const manual = buildManual();
  let sleeper = [];
  let failure = null;

  try{
    sleeper = await loadSleeper();
  }catch(e){
    console.error(e);
    failure = e.message || String(e);
  }

  const seen = new Set(sleeper.map(s=>s.season));
  STATE.allSeasons = sleeper.concat(manual.filter(m=>!seen.has(m.season)))
                            .sort((a,b)=>a.season-b.season);

  if(!STATE.allSeasons.length){
    setStatus('Could not load any league data: ' + (failure||'unknown error') +
              '. Reload to try again.', true);
    return;
  }

  STATE.selected = new Set(STATE.allSeasons.map(s=>s.season));
  STATE.forecast = buildForecast(STATE.allSeasons);
  STATE.loaded   = true;

  recompute();

  const sl = STATE.allSeasons.filter(s=>s.source==='sleeper').length;
  const mn = STATE.allSeasons.length - sl;
  if(failure){
    // The NFL.com years live in this file and need no network, so show them
    // rather than failing the whole page because Sleeper was unreachable.
    setStatus(`Sleeper is not responding (${failure}). Showing the ${mn} archived `
      + `season${mn===1?'':'s'} only — reload to try again.`, true);
  } else {
    setStatus(`Loaded ${sl} Sleeper season${sl===1?'':'s'}`
      + (mn?` and ${mn} archived`:'') + `. Last refreshed ${new Date().toLocaleString()}.`);
  }

  if(UNRESOLVED.length){
    const byOwner = {};
    UNRESOLVED.forEach(u => (byOwner[u.ownerId] = byOwner[u.ownerId] || []).push(u));
    console.log('%c' + UNRESOLVED.length + ' roster(s) have no name. Paste these into IDENTITY:',
                'color:#F2A33C;font-weight:600');
    console.log(Object.entries(byOwner).map(([id,list]) =>
      `  '${id}' : 'NAME_HERE',   // ${list[0].teamName} \u2014 roster `
      + `${list.map(l=>l.rosterId).join('/')} in ${list.map(l=>l.season).join(', ')}`
      + ` \u2014 record ${list[0].record}`).join('\n'));
  }
})();
