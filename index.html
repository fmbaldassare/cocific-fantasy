<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocific Fantasy — League Record Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1330;
  --ink2:#161D42;
  --ink3:#1E2755;
  --line:#2C376B;
  --paper:#E9E5D8;
  --dim:#8E97C4;
  --amber:#F2A33C;
  --amber-dk:#B9741E;
  --mint:#5FD9A6;
  --rose:#E8615A;
  --ghost:#3A4478;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Barlow',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* ---------- header ---------- */
header{padding:38px 0 0}
.brand{display:flex;align-items:center;gap:22px;margin-bottom:6px}
#logo{
  height:118px;width:auto;max-width:150px;object-fit:contain;flex:0 0 auto;
  /* emblem stands on its own — no card behind it */
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.55));
}
@media(max-width:520px){ #logo{height:74px} .brand{gap:14px} }
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--amber);margin-bottom:10px;
}
h1{
  font-family:'Anton',Impact,sans-serif;
  font-size:clamp(46px,9vw,92px);
  line-height:.88;letter-spacing:.01em;
  margin:0 0 6px;text-transform:uppercase;
}
h1 .thin{color:var(--ghost)}
.tagline{color:var(--dim);max-width:60ch;margin:0 0 26px}

/* ---------- signature: recovery strip ---------- */
.strip{
  display:flex;gap:3px;align-items:flex-end;
  padding:18px 0 10px;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-bottom:8px;
  overflow-x:auto;
}
.yr{flex:1 1 0;min-width:44px;text-align:center;position:relative}
.yr .bar{
  height:46px;border-radius:2px;margin-bottom:7px;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:5px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  transition:transform .18s ease;
}
.yr.has .bar{background:linear-gradient(180deg,var(--ink3),var(--amber-dk));border:1px solid var(--amber);color:var(--paper)}
.yr.miss .bar{background:repeating-linear-gradient(135deg,transparent,transparent 4px,var(--ghost) 4px,var(--ghost) 5px);border:1px dashed var(--ghost);color:var(--ghost)}
.yr:hover .bar{transform:translateY(-3px)}
.yr .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.yr.has .lbl{color:var(--paper)}
.strip-key{
  display:flex;gap:20px;font-size:12px;color:var(--dim);
  font-family:'IBM Plex Mono',monospace;margin-bottom:30px;flex-wrap:wrap;
}
.strip-key b{color:var(--amber);font-weight:600}

/* ---------- header from config ---------- */
$('#eyebrow').textContent = CONFIG.eyebrow;
$('#tagline').textContent = CONFIG.tagline;
if(CONFIG.logo){
  const lg=$('#logo');
  lg.src=CONFIG.logo; lg.alt=CONFIG.leagueName+' logo'; lg.hidden=false;
  lg.addEventListener('error',()=>{ lg.hidden=true; console.warn('Logo not found:',CONFIG.logo); });
}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:26px}
nav.tabs button{
  font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.09em;
  text-transform:uppercase;background:transparent;color:var(--dim);
  border:1px solid transparent;border-bottom:2px solid transparent;
  padding:9px 15px;cursor:pointer;
}
nav.tabs button:hover{color:var(--paper)}
nav.tabs button[aria-selected="true"]{color:var(--amber);border-bottom-color:var(--amber)}
nav.tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- generic ---------- */
h2{font-family:'Anton',sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:34px 0 14px;font-weight:400}
h2:first-child{margin-top:0}
h3{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:26px 0 10px;font-weight:600}
.panel{display:none}
.panel.on{display:block}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:18px 20px;margin-bottom:14px}
.muted{color:var(--dim)}
.small{font-size:13px}
select{
  background:var(--ink3);color:var(--paper);border:1px solid var(--line);
  padding:7px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;border-radius:2px;
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);text-align:right;
  padding:8px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;
}
th:first-child,td:first-child{text-align:left}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--paper)}
th[aria-sort]{color:var(--amber)}
th.sortable:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
td{padding:9px;border-bottom:1px solid rgba(44,55,107,.45);text-align:right;font-variant-numeric:tabular-nums}
td.name{font-weight:600}
tbody tr:hover{background:rgba(30,39,85,.5)}
.num{font-family:'IBM Plex Mono',monospace}
.pos{color:var(--mint)}
.neg{color:var(--rose)}
.rank{color:var(--dim);font-family:'IBM Plex Mono',monospace;width:34px}
.tag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;
  border:1px solid var(--line);color:var(--dim);margin-left:8px;
}
.tag.sleeper{border-color:var(--amber);color:var(--amber)}
.tag.manual{border-color:var(--ghost);color:var(--ghost)}
.champ{color:var(--amber)}
.shame-last{color:var(--rose);font-weight:600}
.cons{color:var(--mint);font-weight:600}

/* matchups */
.game{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:12px 16px;margin-bottom:7px}
.game .side{display:flex;flex-direction:column}
.game .side.r{text-align:right;align-items:flex-end}
.game .tm{font-weight:600}
.game .sc{font-family:'IBM Plex Mono',monospace;font-size:19px}
.game .vs{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em}
.game .w{color:var(--amber)}

/* bowls */
.bowl{background:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:16px 18px;margin-bottom:12px}
.bowl.featured{border-color:var(--amber);background:linear-gradient(180deg,var(--ink3),var(--ink2))}
.bowl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bowl-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;
  border-bottom:1px solid var(--line);padding-bottom:9px}
.bowl-name{font-family:'Anton',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.bowl.featured .bowl-name{font-size:27px;color:var(--amber)}
.bowl-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);font-style:italic}
.bowl-score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:6px}
.bs-side{display:flex;flex-direction:column;gap:2px}
.bs-side.r{text-align:right}
.bs-name{font-size:13px;color:var(--dim)}
.bs-name.lead{color:var(--paper);font-weight:600}
.bs-w{font-family:'Anton',sans-serif;font-size:34px;line-height:1;color:var(--ghost)}
.bs-w.lead{color:var(--amber)}
.bs-dash{font-family:'IBM Plex Mono',monospace;color:var(--dim)}
.bowl-series{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);
  text-align:center;margin-bottom:12px}
.bowl-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:0}
.bowl-stats .bstat{margin:0}
.bowl-stats dt{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.bowl-stats dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums}
.bwhen{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.bowl-empty{color:var(--dim);font-style:italic;font-size:13px}

/* h2h matrix */
.matrix-scroll{overflow-x:auto}
table.matrix td,table.matrix th{padding:6px;font-size:12px;text-align:center}
table.matrix th.rowh,table.matrix td.rowh{text-align:left;position:sticky;left:0;background:var(--ink);z-index:1;white-space:nowrap}
table.matrix td.self{background:var(--ink3);color:var(--ghost)}

/* odds bar */
.oddsbar{display:block;height:5px;background:var(--ink3);border-radius:3px;overflow:hidden;margin-bottom:4px;min-width:70px}
.oddsbar span{display:block;height:100%;background:linear-gradient(90deg,var(--amber-dk),var(--amber))}

/* stat cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.stat .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.stat .v{font-family:'Anton',sans-serif;font-size:30px;line-height:1;margin-bottom:4px}
.stat .who{font-size:13px;color:var(--paper)}
.stat .when{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}

/* status */
#status{
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);
  border-left:2px solid var(--amber);padding:8px 0 8px 14px;margin-bottom:20px;
}
#status.err{border-left-color:var(--rose);color:var(--rose)}
code{font-family:'IBM Plex Mono',monospace;background:var(--ink3);padding:1px 5px;border-radius:2px;font-size:13px}
pre{background:var(--ink3);border:1px solid var(--line);padding:14px;overflow-x:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;border-radius:3px}
a{color:var(--amber)}
.empty{color:var(--dim);font-style:italic;padding:20px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:640px){
  .game{grid-template-columns:1fr auto 1fr;padding:10px}
  .game .sc{font-size:16px}
  th,td{padding:7px 5px;font-size:13px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <img id="logo" alt="" hidden>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1>Cocific<br><span class="thin">Fantasy</span></h1>
    </div>
  </div>
  <p class="tagline" id="tagline"></p>
</header>

<div class="strip" id="strip"></div>
<div class="strip-key">
  <span><b>Solid</b> = data loaded</span>
  <span><b>Hatched</b> = season not recovered yet</span>
</div>

<div id="status">Loading league chain from Sleeper…</div>

<nav class="tabs" role="tablist">
  <button role="tab" data-p="overview" aria-selected="true">Overview</button>
  <button role="tab" data-p="seasons" aria-selected="false">Seasons</button>
  <button role="tab" data-p="matchups" aria-selected="false">Matchups</button>
  <button role="tab" data-p="alltime" aria-selected="false">All-Time</button>
  <button role="tab" data-p="h2h" aria-selected="false">Head-to-Head</button>
  <button role="tab" data-p="records" aria-selected="false">Records</button>
  <button role="tab" data-p="forecast" aria-selected="false">Forecast</button>
  <button role="tab" data-p="shame" aria-selected="false">Shame</button>
  <button role="tab" data-p="drafts" aria-selected="false">Drafts</button>
  <button role="tab" data-p="data" aria-selected="false">Data</button>
</nav>

<section class="panel on" id="p-overview"></section>
<section class="panel" id="p-seasons"></section>
<section class="panel" id="p-matchups"></section>
<section class="panel" id="p-alltime"></section>
<section class="panel" id="p-h2h"></section>
<section class="panel" id="p-records"></section>
<section class="panel" id="p-forecast"></section>
<section class="panel" id="p-shame"></section>
<section class="panel" id="p-drafts"></section>
<section class="panel" id="p-data"></section>

</div>

<script>
/* ============================================================================
   COCIFIC FANTASY — LEAGUE RECORD BOOK
   ----------------------------------------------------------------------------
   Everything you need to edit lives in the three blocks below.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   1. CONFIG
   ------------------------------------------------------------------------- */
const CONFIG = {
  currentLeagueId : '1383865559610822656',  // most recent Sleeper season
  firstSeason     : 2015,                   // league founded (NFL.com era)
  leagueName      : 'Cocific Fantasy',

  // Logo: put an image file next to this HTML and name it here, e.g.
  // 'logo.png'. A full https:// URL works too. Leave '' for no logo.
  logo            : 'logo.png',

  eyebrow         : 'Est. 2015 · 16 managers · two platforms',

  // How dead last is decided:
  //   'standings'   — worst regular-season record (this is Cocific's rule)
  //   'consolation' — loser of the final game in the losers bracket
  // Ties are broken by points for: the lower-scoring team finishes last.
  lastPlaceRule   : 'standings',

  // The paragraph under the title. Edit freely.
  tagline         : 'Doce temporadas. Dieciséis managers. Un solo registro. '
                  + 'Lo que algunos intentaron borrar sobrevivió a pandemias, '
                  + 'estallidos y toda clase de incivilidades, y desde hoy queda '
                  + 'en la nube. Inspirado en las tablitas de JTA.'
};

/* ---------------------------------------------------------------------------
   1b. PUNISHMENTS  —  the bottom two, every season
   ---------------------------------------------------------------------------
   The page works out who finished last and second-to-last on its own. What it
   cannot know is what they had to do about it. Fill that in here.

     2022 : 'Whatever they both had to do'
     2022 : { last: 'Something worse', secondLast: 'Something milder' }

   A season listed here shows up even if we have no standings for it yet, so
   the NFL.com years appear with their punishment and the names left blank.
   ------------------------------------------------------------------------- */
const PUNISHMENTS = {
  2015 : '👯 Cheerleaders',
  2016 : '🤠 Cowboys',
  2017 : '🏊‍♂️ Baywatch',
  2018 : '🕺 Chayanne',
  2019 : '🍖 Asado (COVID)',
  2020 : '🍋 Boy Scouts',
  2021 : '🏴‍☠️ Piratas del Caribe',
  2022 : '👨‍🎓 PAES',
  2023 : 'Suspended 😌',
  2024 : 'Suspended 😌',
  2025 : 'Suspended 😌'
};

const LAST_PLACE = {
};

/* ---------------------------------------------------------------------------
   2. IDENTITY MAP  —  the most important block in this file
   ---------------------------------------------------------------------------
   One person, many team names. You were "Milwaukee Beers", "Tasmania Beers"
   and "Llolleo Beers" in different years — without this, all-time records
   count you as three different managers.

   Key   = a Sleeper display name, a Sleeper user_id, or an NFL.com team name
   Value = the canonical person

   Anyone not listed here falls back to their Sleeper display name, so the
   page works today and gets more accurate as you fill this in.
   ------------------------------------------------------------------------- */
const IDENTITY = {
  // --- Two different Sleeper accounts, same person -------------------------
  '590266991147786240' : 'Jpsilva01',    // Jpsilva01  — 2020 only
  '740256872346607616' : 'Jpsilva01',    // jpsilva047 — 2021 onward

  // --- One account that was renamed (same user_id, so no merge needed;
  //     listed here only so the older name isn't what shows up) -------------
  '462681756420534272' : 'fjgonzalezb',  // was fjgonzalezb, now fjgonzalezb1984

  // --- Francesco: Sleeper account plus the NFL.com-era team names, so
  //     manual history rows land in the same row as the Sleeper ones --------
  '589856753194151936' : 'fbaldassare',
  'Milwaukee Beers'    : 'fbaldassare',
  'Tasmania Beers'     : 'fbaldassare',
  'Llolleo Beers'      : 'fbaldassare',

  // --- 2022 abandoned rosters ---------------------------------------------
  // Sleeper stores owner_id as null for these, so there is no durable ID to
  // key on. season:roster is the only option, and it is safe because it names
  // exactly one team in exactly one season.
  '2022:3' : 'NegroCastro',   // held Master Yoda in 2021, nlarrain took the slot in 2023
  '2022:8' : 'josekutz'       // held Medulla Oblongada in 2021, Tonino93 took the slot in 2023

  // --- Possible correction, uncomment if it applies ------------------------
  // In 2025 and 2026 roster 9 (Milwaukee Weed) is registered to NegroCastro
  // with fbaldassare as co-owner — the reverse of 2022–2024. If that is a
  // registration quirk rather than a real handover, these two lines put the
  // team back under the manager who actually plays it:
  // ,'2025:9' : 'fbaldassare'
  // ,'2026:9' : 'fbaldassare'
};

/* ---------------------------------------------------------------------------
   1d. BOWLS  —  the named rivalries
   ---------------------------------------------------------------------------
   Names must match the values used in IDENTITY. Put the marquee one first:
   `featured: true` gives it the full-width treatment at the top.
   ------------------------------------------------------------------------- */
const RIVALRIES = [
  { name:'AMSA Bowl',       sub:'Madre de todos los bowls', a:'jtalvarino',  b:'nlarrain',    featured:true },
  { name:'VV Bowl',         sub:'',  a:'josekutz',    b:'Jpsilva01'  },
  { name:'Senior Bowl',     sub:'',  a:'NegroCastro', b:'diego678'   },
  { name:'Charger Bowl',    sub:'',  a:'NegroCastro', b:'harryklenner' },
  { name:'Korioto Bowl',    sub:'',  a:'Tonino93',    b:'TicaBM'     },
  { name:'Junior Bowl',     sub:'',  a:'TicaBM',      b:'harryklenner' },
  { name:'TC Bowl',         sub:'',  a:'NegroCastro', b:'dvelarde'   },
  { name:'St. George Bowl', sub:'',  a:'Rura',        b:'FM17'       }
];

/* ---------------------------------------------------------------------------
   2b. TEAM NAME OVERRIDES
   ---------------------------------------------------------------------------
   Sleeper keeps a team name in the owner's user record. When a roster has no
   owner (see the 2022 entries above) that name is simply gone, and the page
   falls back to "Roster N". Fill it back in here, keyed by season:roster.
   ------------------------------------------------------------------------- */
const TEAM_NAMES = {
  '2022:3' : 'Master Yoda',
  '2022:8' : 'Medulla Oblongada'
};

/* ---------------------------------------------------------------------------
   2c. CO-OWNER OVERRIDES
   ---------------------------------------------------------------------------
   Sleeper stores co-owners as they are *today*, not as they were during the
   season. Someone added after a season ended still shows up on that season's
   roster. Use this to correct history, keyed by season:roster.

     '2022:9' : []                  -> no co-owners that season
     '2023:1' : ['SomeManager']     -> force a specific list
   ------------------------------------------------------------------------- */
const CO_OWNERS = {
  '2022:9' : []   // Milwaukee Beers — managed alone in 2022; NegroCastro was
                  // added later and already has his own team (Master Yoda)
};

/* ---------------------------------------------------------------------------
   3. MANUAL HISTORY  —  the NFL.com years (2015–2019)
   ---------------------------------------------------------------------------
   Fill these in from screenshots, old emails, or the ESPN migration when it
   lands. Every season you complete turns its bar solid in the strip up top.

   finish: 1 = champion, 2 = runner-up, etc. Leave out if unknown.
   Partial seasons are fine — add what you know, leave the rest.
   ------------------------------------------------------------------------- */
const MANUAL_HISTORY = [
  // {
  //   season: 2020,
  //   teams: [
  //     { manager:'Francesco', wins:9, losses:5, ties:0, pf:1587.2, pa:1440.8, finish:3 },
  //     { manager:'Someone',   wins:11, losses:3, ties:0, pf:1702.4, pa:1388.1, finish:1 }
  //   ],
  //   notes: '14 teams, half-PPR'
  // },
];

/* ---------------------------------------------------------------------------
   Nothing below here needs editing.
   ========================================================================== */

const API = 'https://api.sleeper.app/v1';
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!==undefined)n.innerHTML=h; return n; };
const fmt = (n,d=1) => (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toFixed(d);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STATE = { seasons: [], managers: {}, loaded:false };
const UNRESOLVED = [];

function canon(o){
  // Resolution order, most durable first:
  //   1. owner_id        — never changes, survives name changes and new seasons
  //   2. "season:roster" — explicit per-season override
  //   3. display name    — what Sleeper reports (or an active co-owner's name)
  // Deliberately NO bare "roster N" key: roster numbers are reused across
  // seasons, so such a mapping silently attaches to the wrong team later.
  if(o.userId    && IDENTITY[o.userId])    return IDENTITY[o.userId];
  if(o.seasonKey && IDENTITY[o.seasonKey]) return IDENTITY[o.seasonKey];
  if(o.name      && IDENTITY[o.name])      return IDENTITY[o.name];
  return o.name || o.fallback || 'Unknown';
}

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status + ' on ' + url);
  return r.json();
}

/* ---------- load the whole Sleeper chain ---------- */
async function loadSleeper(){
  const chain = [];
  let id = CONFIG.currentLeagueId;
  let guard = 0;
  while(id && id !== '0' && guard++ < 30){
    const lg = await getJSON(`${API}/league/${id}`);
    chain.push(lg);
    id = lg.previous_league_id;
  }
  chain.reverse();
  setStatus(`Found ${chain.length} Sleeper season${chain.length===1?'':'s'}. Loading details…`);

  const out = [];
  for(const lg of chain){
    try { out.push(await loadSeason(lg)); }
    catch(e){ console.warn('season failed', lg.season, e); }
  }
  return out;
}

async function loadSeason(lg){
  const [users, rosters] = await Promise.all([
    getJSON(`${API}/league/${lg.league_id}/users`),
    getJSON(`${API}/league/${lg.league_id}/rosters`)
  ]);

  const userById = {};
  users.forEach(u => userById[u.user_id] = u);

  const teams = rosters.map(r => {
    const u = userById[r.owner_id] || {};

    // Every co-owner on the roster, resolved to a user record.
    const coList = (Array.isArray(r.co_owners) ? r.co_owners : [])
      .filter(id => id && id !== r.owner_id)
      .map(id => userById[id])
      .filter(Boolean);

    // If the primary owner left the league their user record is gone, but an
    // active co-owner has usually been running the team. Promote them.
    const co = (!u.display_name && coList.length) ? coList[0] : null;

    const seasonKey = `${lg.season}:${r.roster_id}`;
    const name = u.display_name || (co && co.display_name) || null;
    const teamName = TEAM_NAMES[seasonKey]
      || (u.metadata && u.metadata.team_name)
      || (co && co.metadata && co.metadata.team_name)
      || name || `Roster ${r.roster_id}`;
    const s = r.settings || {};

    const manager = canon({
      name,
      userId    : r.owner_id,
      seasonKey,
      fallback  : `Unclaimed roster ${r.roster_id}`
    });

    if(!name && !IDENTITY[r.owner_id] && !IDENTITY[seasonKey]){
      UNRESOLVED.push({season:lg.season, rosterId:r.roster_id, ownerId:r.owner_id,
                       teamName, record:`${s.wins||0}-${s.losses||0}`});
    }

    // An explicit override wins over whatever Sleeper reports today.
    const derivedCo = coList.filter(c => !co || c.user_id !== co.user_id)
                            .map(c => canon({name:c.display_name, userId:c.user_id}));

    return {
      rosterId : r.roster_id,
      ownerId  : r.owner_id,
      manager,
      teamName,
      coOwners : (CO_OWNERS[seasonKey] !== undefined) ? CO_OWNERS[seasonKey] : derivedCo,
      viaCoOwner : !u.display_name && !!co,
      wins     : s.wins||0,
      losses   : s.losses||0,
      ties     : s.ties||0,
      pf       : (s.fpts||0) + (s.fpts_decimal||0)/100,
      pa       : (s.fpts_against||0) + (s.fpts_against_decimal||0)/100
    };
  });

  const byRoster = {};
  teams.forEach(t => byRoster[t.rosterId] = t);

  const regEnd = (lg.settings && lg.settings.playoff_week_start)
    ? lg.settings.playoff_week_start - 1 : 14;
  const lastWeek = Math.min(regEnd + 4, 18);

  const weekData = await Promise.all(
    Array.from({length:lastWeek}, (_,i) =>
      getJSON(`${API}/league/${lg.league_id}/matchups/${i+1}`).catch(()=>[])
    )
  );

  const weeks = [];
  const schedule = [];
  weekData.forEach((rows,i) => {
    if(!rows || !rows.length) return;

    const groups = {};
    rows.forEach(r => {
      const k = r.matchup_id ?? ('solo'+r.roster_id);
      (groups[k] = groups[k] || []).push(r);
    });
    const games = Object.values(groups)
      .filter(g => g.length === 2)
      .map(g => ({
        a: { rosterId:g[0].roster_id, points:g[0].points||0 },
        b: { rosterId:g[1].roster_id, points:g[1].points||0 }
      }));
    if(!games.length) return;

    // Pairings exist before a week is played — keep them for forecasting.
    schedule.push({ week:i+1, isPlayoff:(i+1)>regEnd,
                    pairs: games.map(g => [g.a.rosterId, g.b.rosterId]) });

    const scored = rows.filter(r => r.points !== null && r.points !== undefined);
    if(!scored.length) return;
    if(scored.every(r => !r.points)) return;   // week not played yet

    // In playoff weeks Sleeper still returns a row for every roster, including
    // eliminated teams whose leftover players score a few stray points. Only
    // rosters actually paired in a game count as having played.
    const playing = new Set();
    games.forEach(g => { playing.add(g.a.rosterId); playing.add(g.b.rosterId); });
    const solo = rows.filter(r => playing.has(r.roster_id))
                     .map(r => ({ rosterId:r.roster_id, points:r.points||0 }));

    weeks.push({ week:i+1, games, allScores:solo, isPlayoff:(i+1)>regEnd });
  });

  // champion, third place and playoff field, all from the winners bracket
  let champion=null, runnerUp=null, third=null, playoffTeams=[];
  try{
    const wb = await getJSON(`${API}/league/${lg.league_id}/winners_bracket`) || [];
    const who = rid => byRoster[rid] ? byRoster[rid].manager : null;

    const final = wb.find(m => m.p === 1);
    if(final && final.w){ champion = who(final.w); runnerUp = who(final.l); }

    const thirdGame = wb.find(m => m.p === 3);
    if(thirdGame && thirdGame.w) third = who(thirdGame.w);

    // Anyone appearing in the winners bracket made the playoffs.
    const ids = new Set();
    wb.forEach(m => { [m.t1, m.t2, m.w, m.l].forEach(x => { if(x) ids.add(x); }); });
    playoffTeams = [...ids].map(who).filter(Boolean);
  }catch(e){}

  // consolation (losers) bracket
  let consolationWinner=null, consolationRunnerUp=null, bottomPair=null;
  try{
    const lb = await getJSON(`${API}/league/${lg.league_id}/losers_bracket`) || [];
    const who = rid => byRoster[rid] || null;

    // p === 1 in the losers bracket is that bracket's own final
    const cf = lb.find(m => m.p === 1);
    if(cf && cf.w){
      consolationWinner   = who(cf.w) ? who(cf.w).manager : null;
      consolationRunnerUp = who(cf.l) ? who(cf.l).manager : null;
    }

    // the highest placement number is the game that settles dead last
    const maxP = lb.reduce((mx,m) => (typeof m.p === 'number' && m.p > mx) ? m.p : mx, 0);
    if(maxP){
      const g = lb.find(m => m.p === maxP);
      if(g && g.l && who(g.l) && who(g.w)) bottomPair = [who(g.w), who(g.l)];
    }
  }catch(e){}

  // draft
  let draft = [];
  try{
    const drafts = await getJSON(`${API}/league/${lg.league_id}/drafts`);
    if(drafts && drafts.length){
      const d = drafts.sort((a,b)=>(b.start_time||0)-(a.start_time||0))[0];
      const picks = await getJSON(`${API}/draft/${d.draft_id}/picks`);
      draft = (picks||[]).map(p => {
        const m = p.metadata||{};
        return {
          round:p.round, pick:p.pick_no,
          manager: byRoster[p.roster_id] ? byRoster[p.roster_id].manager : (p.picked_by||'—'),
          player: [m.first_name,m.last_name].filter(Boolean).join(' ') || p.player_id,
          position: m.position||'', team: m.team||''
        };
      });
    }
  }catch(e){}

  return {
    season:+lg.season, source:'sleeper', leagueId:lg.league_id, name:lg.name,
    teams, byRoster, weeks, schedule, regEnd, champion, runnerUp, draft,
    consolationWinner, consolationRunnerUp, bottomPair, third, playoffTeams,
    teamCount: teams.length,
    // If a league plays an extra weekly game against the league median, the
    // official W-L will not match what the head-to-head matchups alone imply.
    medianMatch: !!(lg.settings && lg.settings.league_average_match),
    playoffTeamCount: (lg.settings && lg.settings.playoff_teams) || null,
    scoring: (lg.scoring_settings && lg.scoring_settings.rec) ? `${lg.scoring_settings.rec} PPR` : 'standard'
  };
}

/* ---------- fold manual seasons into the same shape ---------- */
function buildManual(){
  return MANUAL_HISTORY.map(h => {
    const teams = (h.teams||[]).map((t,i) => ({
      rosterId:'m'+i, manager:canon({name:t.manager}), teamName:t.manager,
      wins:t.wins||0, losses:t.losses||0, ties:t.ties||0,
      pf:t.pf||0, pa:t.pa||0, finish:t.finish
    }));
    const champ = teams.find(t => t.finish===1);
    const ru    = teams.find(t => t.finish===2);
    const trd   = teams.find(t => t.finish===3);
    return {
      season:+h.season, source:'manual', name:CONFIG.leagueName,
      teams, byRoster:{}, weeks:[], regEnd:null,
      champion: champ?champ.manager:null, runnerUp: ru?ru.manager:null,
      consolationWinner:null, consolationRunnerUp:null, bottomPair:null, schedule:[],
      third: trd?trd.manager:null, playoffTeams:[],
      draft:[], teamCount:teams.length, notes:h.notes||'', scoring:'—'
    };
  });
}

/* ---------- aggregate all-time ---------- */
function buildManagers(seasons){
  const m = {};
  const get = n => m[n] = m[n] || {
    name:n, seasons:0, wins:0, losses:0, ties:0, pf:0, pa:0,
    titles:0, finals:0, seconds:0, thirds:0, playoffs:0, consolations:0,
    years:[], allPlayW:0, allPlayL:0, best:null
  };

  seasons.forEach(s => {
    s.teams.forEach(t => {
      const r = get(t.manager);
      r.seasons++; r.wins+=t.wins; r.losses+=t.losses; r.ties+=t.ties;
      r.pf+=t.pf; r.pa+=t.pa; r.years.push(s.season);
    });
    if(s.champion) { get(s.champion).titles++; get(s.champion).finals++; }
    if(s.runnerUp) { get(s.runnerUp).finals++;  get(s.runnerUp).seconds++; }
    if(s.third)    get(s.third).thirds++;
    if(s.consolationWinner) get(s.consolationWinner).consolations++;
    (s.playoffTeams||[]).forEach(n => get(n).playoffs++);

    // all-play from regular season weeks
    s.weeks.filter(w => !w.isPlayoff).forEach(w => {
      const scores = w.allScores.filter(x => s.byRoster[x.rosterId]);
      scores.forEach(x => {
        const t = s.byRoster[x.rosterId]; if(!t) return;
        const r = get(t.manager);
        scores.forEach(y => {
          if(y.rosterId===x.rosterId) return;
          if(x.points > y.points) r.allPlayW++; else if(x.points < y.points) r.allPlayL++;
        });
        if(r.best===null || x.points>r.best.points) r.best={points:x.points,season:s.season,week:w.week};
      });
    });
  });

  Object.values(m).forEach(r => {
    const g = r.wins+r.losses+r.ties;
    r.winPct = g ? (r.wins + r.ties*0.5)/g : 0;
    r.ppg = g ? r.pf/g : 0;
    const ap = r.allPlayW+r.allPlayL;
    r.allPlayPct = ap ? r.allPlayW/ap : null;
    r.luck = (r.allPlayPct!==null) ? r.winPct - r.allPlayPct : null;
  });
  return m;
}

/* ---------- named rivalries ---------- */
function buildRivalries(seasons){
  return RIVALRIES.map(r => {
    const meetings = [];
    seasons.forEach(s => s.weeks.forEach(w => w.games.forEach(g => {
      const A=s.byRoster[g.a.rosterId], B=s.byRoster[g.b.rosterId];
      if(!A||!B) return;
      let mine=null;
      if(A.manager===r.a && B.manager===r.b) mine={ap:g.a.points, bp:g.b.points};
      else if(A.manager===r.b && B.manager===r.a) mine={ap:g.b.points, bp:g.a.points};
      if(mine) meetings.push({season:s.season, week:w.week, playoff:w.isPlayoff, ...mine});
    })));
    meetings.sort((x,y)=> x.season-y.season || x.week-y.week);

    const st = {...r, meetings, aw:0, bw:0, t:0, apf:0, bpf:0,
                biggest:null, highest:null, last:null, streak:null};
    meetings.forEach(m => {
      st.apf+=m.ap; st.bpf+=m.bp;
      if(m.ap>m.bp) st.aw++; else if(m.bp>m.ap) st.bw++; else st.t++;
      const marg=Math.abs(m.ap-m.bp), tot=m.ap+m.bp;
      const winner = m.ap>m.bp ? r.a : (m.bp>m.ap ? r.b : null);
      if(!st.biggest || marg>st.biggest.margin) st.biggest={margin:marg, winner, ...m};
      if(!st.highest || tot>st.highest.total)   st.highest={total:tot, ...m};
    });
    if(meetings.length){
      const lm = meetings[meetings.length-1];
      st.last = {...lm, winner: lm.ap>lm.bp ? r.a : (lm.bp>lm.ap ? r.b : null)};
      // trailing run of wins by the same manager
      let who=st.last.winner, n=0;
      for(let i=meetings.length-1; i>=0 && who; i--){
        const m=meetings[i];
        const w = m.ap>m.bp ? r.a : (m.bp>m.ap ? r.b : null);
        if(w===who) n++; else break;
      }
      if(who && n) st.streak={who, n};
    }
    return st;
  });
}

/* ---------- head to head ---------- */
function buildH2H(seasons){
  const h={};
  const add=(a,b,res)=>{ h[a]=h[a]||{}; h[a][b]=h[a][b]||{w:0,l:0,t:0,pf:0,pa:0}; const c=h[a][b];
    if(res.s>res.o)c.w++; else if(res.s<res.o)c.l++; else c.t++; c.pf+=res.s; c.pa+=res.o; };
  seasons.forEach(s => s.weeks.forEach(w => w.games.forEach(g => {
    const A=s.byRoster[g.a.rosterId], B=s.byRoster[g.b.rosterId];
    if(!A||!B) return;
    add(A.manager,B.manager,{s:g.a.points,o:g.b.points});
    add(B.manager,A.manager,{s:g.b.points,o:g.a.points});
  })));
  return h;
}

/* ---------- bottom two, per season and career ---------- */
function punishmentFor(season){
  const p = PUNISHMENTS[season];
  if(!p) return null;
  return (typeof p === 'string') ? {shared:p} : {last:p.last||'', secondLast:p.secondLast||''};
}

function buildShame(seasons){
  const rows = [], tally = {};
  const bump = (name, isLast, season) => {
    const t = tally[name] = tally[name] || {name, bottom2:0, last:0, seasons:[]};
    t.bottom2++; if(isLast) t.last++;
    t.seasons.push(season + (isLast ? '' : '*'));
  };

  seasons.slice().sort((a,b)=>b.season-a.season).forEach(s => {
    const played = s.teams.some(t => (t.wins+t.losses+t.ties) > 0 || t.finish);
    if(!played) return;   // season not started yet

    let pair;
    const ov = LAST_PLACE[s.season];
    if(ov && ov.length === 2){
      pair = ov.map(n => ({manager:n, teamName:'', overridden:true}));
    } else if(CONFIG.lastPlaceRule === 'consolation' && s.bottomPair){
      pair = s.bottomPair;   // [second-to-last, last]
    } else if(s.teams.some(t => t.finish)){
      // manual seasons carry an explicit finishing position
      pair = s.teams.filter(t => t.finish).sort((a,b)=>b.finish-a.finish).slice(0,2).reverse();
    } else {
      const ord = s.teams.slice().sort((a,b)=>{
        const wa=a.wins+a.ties*.5, wb=b.wins+b.ties*.5;
        return wb-wa || b.pf-a.pf;
      });
      pair = ord.slice(-2);
    }
    if(pair.length < 2) return;

    const secondLast = pair[0], last = pair[1];
    rows.push({season:s.season, source:s.source, last, secondLast,
               punishment: punishmentFor(s.season),
               overridden: !!(ov && ov.length===2)});
    bump(last.manager, true, s.season);
    bump(secondLast.manager, false, s.season);
  });

  // Seasons we know the punishment for but not yet who served it.
  Object.keys(PUNISHMENTS).map(Number).forEach(y => {
    if(!rows.find(r => r.season === y))
      rows.push({season:y, last:null, secondLast:null,
                 punishment:punishmentFor(y), unrecovered:true});
  });
  rows.sort((a,b) => b.season - a.season);

  return {rows, tally:Object.values(tally).sort((a,b)=>b.last-a.last || b.bottom2-a.bottom2)};
}

/* ---------- playoff odds: Monte Carlo ----------------------------------------
   Method, and why each piece is there:

   - Each team's weekly score is drawn from a normal distribution with its own
     mean and a league-wide standard deviation. This is the standard approach
     for fantasy playoff odds.
   - A team's mean is NOT its raw scoring average. Points per game is the best
     single predictor available, but noisy in small samples, so the raw average
     is shrunk toward the league mean: after n weeks the estimate is
     (n*observed + K*league) / (n + K), with K = 5. Early on a team is mostly
     league-average; by week 10 its own scoring dominates. Ordinary
     empirical-Bayes shrinkage, and it beats using the raw average.
   - Remaining games come from the real schedule, so strength of schedule is
     handled implicitly rather than modelled.
   - 10,000 seasons simulated. Standings ranked by wins, then points for,
     matching how the league actually breaks ties.

   Deliberately NOT modelled: individual players, injuries, or draft quality.
   Before any games are played every team sits at the league mean, so the odds
   come out near-uniform. That is the honest answer, not a broken model - a
   drafted roster carries no information this page can measure.
--------------------------------------------------------------------------- */
function buildForecast(){
  const cur = STATE.seasons.filter(s=>s.source==='sleeper').pop();
  if(!cur || !cur.schedule || !cur.schedule.length) return null;

  const SIMS = 10000, K = 5;

  const pool = [];
  STATE.seasons.filter(s=>s.source==='sleeper').forEach(s =>
    s.weeks.filter(w=>!w.isPlayoff).forEach(w => w.allScores.forEach(x => pool.push(x.points))));
  const lgMean = pool.length ? pool.reduce((a,b)=>a+b,0)/pool.length : 110;
  const lgSD = pool.length>1
    ? Math.sqrt(pool.reduce((a,b)=>a+(b-lgMean)**2,0)/(pool.length-1)) : 28;

  const obs={}, wins={}, pf={};
  cur.teams.forEach(t => { obs[t.rosterId]=[]; wins[t.rosterId]=0; pf[t.rosterId]=0; });
  const played = cur.weeks.filter(w=>!w.isPlayoff);
  played.forEach(w => {
    w.games.forEach(g => {
      pf[g.a.rosterId]+=g.a.points; pf[g.b.rosterId]+=g.b.points;
      if(g.a.points>g.b.points) wins[g.a.rosterId]++;
      else if(g.b.points>g.a.points) wins[g.b.rosterId]++;
      else { wins[g.a.rosterId]+=0.5; wins[g.b.rosterId]+=0.5; }
    });
    w.allScores.forEach(x => { if(obs[x.rosterId]) obs[x.rosterId].push(x.points); });
  });

  const mu={};
  cur.teams.forEach(t => {
    const a=obs[t.rosterId]||[], n=a.length;
    const m = n ? a.reduce((x,y)=>x+y,0)/n : lgMean;
    mu[t.rosterId] = (n*m + K*lgMean) / (n + K);
  });

  const playedSet = new Set(played.map(w=>w.week));
  const remaining = cur.schedule.filter(w => !w.isPlayoff && !playedSet.has(w.week));
  const spots = cur.playoffTeamCount || 6;

  let spare=null;
  const gauss = () => {
    if(spare!==null){ const v=spare; spare=null; return v; }
    let u=0,v=0,s2=0;
    do { u=Math.random()*2-1; v=Math.random()*2-1; s2=u*u+v*v; } while(!s2||s2>=1);
    const f=Math.sqrt(-2*Math.log(s2)/s2);
    spare=v*f; return u*f;
  };

  const ids = cur.teams.map(t=>t.rosterId);
  const made={}, seedSum={}, winSum={}, topSeed={};
  ids.forEach(i => { made[i]=0; seedSum[i]=0; winSum[i]=0; topSeed[i]=0; });

  for(let s=0;s<SIMS;s++){
    const w={}, p={};
    ids.forEach(i => { w[i]=wins[i]; p[i]=pf[i]; });
    remaining.forEach(week => week.pairs.forEach(pair => {
      const x=pair[0], y=pair[1];
      const sx = mu[x] + gauss()*lgSD;
      const sy = mu[y] + gauss()*lgSD;
      p[x]+=sx; p[y]+=sy;
      if(sx>sy) w[x]++; else if(sy>sx) w[y]++; else { w[x]+=0.5; w[y]+=0.5; }
    }));
    const order = ids.slice().sort((a,b)=> w[b]-w[a] || p[b]-p[a]);
    order.forEach((id,idx) => {
      seedSum[id]+=idx+1; winSum[id]+=w[id];
      if(idx<spots) made[id]++;
      if(idx===0) topSeed[id]++;
    });
  }

  const rows = cur.teams.map(t => ({
    manager: t.manager, teamName: t.teamName,
    wins: wins[t.rosterId], games: played.length,
    ppg: obs[t.rosterId].length ? pf[t.rosterId]/obs[t.rosterId].length : null,
    projWins: winSum[t.rosterId]/SIMS,
    seed: seedSum[t.rosterId]/SIMS,
    odds: made[t.rosterId]/SIMS,
    top: topSeed[t.rosterId]/SIMS
  })).sort((a,b)=> b.odds-a.odds || b.projWins-a.projWins);

  return {rows, lgMean, lgSD, spots, weeksPlayed:played.length,
          weeksLeft:remaining.length, season:cur.season, sims:SIMS, K};
}

function buildRecords(seasons, scope){
  // scope: 'all' | 'reg' | 'post'
  const keep = w => scope==='reg' ? !w.isPlayoff : scope==='post' ? w.isPlayoff : true;
  const r = { high:null, low:null, blowout:null, close:null, highLoss:null, lowWin:null, combo:null };
  seasons.forEach(s => s.weeks.filter(keep).forEach(w => {
    w.games.forEach(g => {
      const A=s.byRoster[g.a.rosterId], B=s.byRoster[g.b.rosterId];
      if(!A||!B) return;
      const hi = g.a.points>=g.b.points ? {t:A,p:g.a.points,o:B,op:g.b.points} : {t:B,p:g.b.points,o:A,op:g.a.points};
      const marg = Math.abs(g.a.points-g.b.points);
      const tot  = g.a.points+g.b.points;
      const ctx  = {season:s.season, week:w.week, playoff:w.isPlayoff};
      if(!r.blowout || marg>r.blowout.margin) r.blowout={margin:marg, win:hi.t.manager, lose:hi.o.manager, ws:hi.p, ls:hi.op, ...ctx};
      if(!r.close   || marg<r.close.margin)   r.close  ={margin:marg, win:hi.t.manager, lose:hi.o.manager, ws:hi.p, ls:hi.op, ...ctx};
      if(!r.highLoss|| hi.op>r.highLoss.points) r.highLoss={points:hi.op, who:hi.o.manager, beatBy:hi.t.manager, ...ctx};
      if(!r.lowWin  || hi.p<r.lowWin.points)  r.lowWin ={points:hi.p, who:hi.t.manager, ...ctx};
      if(!r.combo   || tot>r.combo.total)     r.combo  ={total:tot, a:A.manager, b:B.manager, ...ctx};
    });
    w.allScores.forEach(x => {
      const T=s.byRoster[x.rosterId]; if(!T||!x.points) return;
      const ctx={season:s.season,week:w.week};
      if(!r.high || x.points>r.high.points) r.high={points:x.points, who:T.manager, ...ctx};
      if(!r.low  || x.points<r.low.points)  r.low ={points:x.points, who:T.manager, ...ctx};
    });
  }));
  return r;
}

/* ============================ RENDERING ============================ */

function setStatus(t, isErr){
  const s=$('#status'); s.textContent=t; s.className = isErr?'err':'';
}

function renderStrip(){
  const strip=$('#strip'); strip.innerHTML='';
  const now = new Date().getFullYear();
  const last = Math.max(now, ...STATE.seasons.map(s=>s.season));
  for(let y=CONFIG.firstSeason; y<=last; y++){
    const s = STATE.seasons.find(x=>x.season===y);
    const d = el('div','yr '+(s?'has':'miss'));
    const src = s ? (s.source==='sleeper'?'SLP':'MAN') : '';
    d.innerHTML = `<div class="bar" title="${s?esc(s.name):'not recovered'}">${src}</div><div class="lbl">'${String(y).slice(2)}</div>`;
    strip.appendChild(d);
  }
}

function renderSeasons(){
  const p=$('#p-seasons'); p.innerHTML='';
  if(!STATE.seasons.length){ p.appendChild(el('div','empty','No seasons loaded.')); return; }
  const ctr=el('div','controls');
  const sel=el('select');
  STATE.seasons.slice().sort((a,b)=>b.season-a.season).forEach(s=>{
    const o=el('option',null,`${s.season} — ${s.source==='sleeper'?'Sleeper':'manual'}`); o.value=s.season; sel.appendChild(o);
  });
  ctr.appendChild(sel); p.appendChild(ctr);
  const box=el('div'); p.appendChild(box);

  const draw=()=>{
    const s=STATE.seasons.find(x=>x.season===+sel.value); box.innerHTML='';
    const h=el('h2',null,`${s.season} standings <span class="tag ${s.source}">${s.source==='sleeper'?'sleeper api':'manual entry'}</span>`);
    box.appendChild(h);
    if(s.notes) box.appendChild(el('div','small muted',esc(s.notes)));

    const teams=s.teams.slice().sort((a,b)=>{
      const wa=a.wins+a.ties*.5, wb=b.wins+b.ties*.5;
      return wb-wa || b.pf-a.pf;
    });
    // Only show the co-owner column in seasons that actually have one.
    const anyCo = teams.some(t => (t.coOwners||[]).length);
    const t=el('table');
    t.innerHTML='<thead><tr><th></th><th>Manager</th>'+(anyCo?'<th>Co-owner</th>':'')+
      '<th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th><th>Diff</th></tr></thead>';
    const tb=el('tbody');
    teams.forEach((tm,i)=>{
      const d=tm.pf-tm.pa;
      const crown = (s.champion===tm.manager) ? ' <span class="champ">&#9733;</span>' : '';
      const inherited = tm.viaCoOwner ? '<span class="tag" title="Primary owner left the league; this is the active co-owner">via co-owner</span>' : '';
      const coCell = anyCo
        ? `<td class="muted small" style="text-align:right">${esc((tm.coOwners||[]).join(', ')) || '—'}</td>`
        : '';
      tb.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(tm.manager)}${crown}${inherited}</td>
        ${coCell}
        <td style="text-align:right" class="muted small">${esc(tm.teamName)}</td>
        <td class="num">${tm.wins}</td><td class="num">${tm.losses}</td><td class="num">${tm.ties}</td>
        <td class="num">${fmt(tm.pf)}</td><td class="num">${fmt(tm.pa)}</td>
        <td class="num ${d>=0?'pos':'neg'}">${d>=0?'+':''}${fmt(d)}</td></tr>`;
    });
    t.appendChild(tb); box.appendChild(t);
  };
  sel.addEventListener('change',draw); draw();
}

function renderMatchups(){
  const p=$('#p-matchups'); p.innerHTML='';
  const withWeeks=STATE.seasons.filter(s=>s.weeks.length);
  if(!withWeeks.length){ p.appendChild(el('div','empty','Week-by-week results only exist for Sleeper seasons. Manual seasons store final standings only.')); return; }

  const ctr=el('div','controls');
  const ssel=el('select'), wsel=el('select');
  withWeeks.slice().sort((a,b)=>b.season-a.season).forEach(s=>{
    const o=el('option',null,String(s.season)); o.value=s.season; ssel.appendChild(o);
  });
  ctr.appendChild(ssel); ctr.appendChild(wsel); p.appendChild(ctr);
  const box=el('div'); p.appendChild(box);

  const fillWeeks=()=>{
    const s=withWeeks.find(x=>x.season===+ssel.value); wsel.innerHTML='';
    s.weeks.forEach(w=>{
      const o=el('option',null,`Week ${w.week}${w.isPlayoff?' — playoffs':''}`); o.value=w.week; wsel.appendChild(o);
    });
  };
  const draw=()=>{
    const s=withWeeks.find(x=>x.season===+ssel.value);
    const w=s.weeks.find(x=>x.week===+wsel.value); box.innerHTML='';
    if(!w) return;
    box.appendChild(el('h2',null,`${s.season} &middot; week ${w.week}`));

    const ranked=w.allScores.slice().sort((a,b)=>b.points-a.points);
    const rankOf={}; ranked.forEach((x,i)=>rankOf[x.rosterId]=i+1);

    w.games.forEach(g=>{
      const A=s.byRoster[g.a.rosterId], B=s.byRoster[g.b.rosterId]; if(!A||!B) return;
      const aw=g.a.points>g.b.points, bw=g.b.points>g.a.points;
      const d=el('div','game');
      d.innerHTML=`
        <div class="side"><span class="tm ${aw?'w':''}">${esc(A.manager)}</span>
          <span class="muted small">${esc(A.teamName)} &middot; #${rankOf[A.rosterId]} this week</span></div>
        <div style="text-align:center"><div class="sc"><span class="${aw?'w':''}">${fmt(g.a.points)}</span> <span class="vs">—</span> <span class="${bw?'w':''}">${fmt(g.b.points)}</span></div></div>
        <div class="side r"><span class="tm ${bw?'w':''}">${esc(B.manager)}</span>
          <span class="muted small">#${rankOf[B.rosterId]} this week &middot; ${esc(B.teamName)}</span></div>`;
      box.appendChild(d);
    });
  };
  ssel.addEventListener('change',()=>{fillWeeks();draw();});
  wsel.addEventListener('change',draw);
  fillWeeks(); draw();
}

const ALLTIME_SORT = { key:'winPct', dir:-1 };

function renderAllTime(){
  const p=$('#p-alltime'); p.innerHTML='';
  p.appendChild(el('h2',null,'All-time manager records'));
  p.appendChild(el('div','small muted','Click any column to sort. All-play is your record if you had played every other team every week — it strips out schedule luck. Luck is the gap between the two: positive means the schedule was kind.'));

  const cols = [
    {key:'name',       label:'Manager', text:true, cell:m=>`<span class="name">${esc(m.name)}</span>`},
    {key:'seasons',    label:'Yrs',       cell:m=>m.seasons},
    {key:'wins',       label:'W',         cell:m=>m.wins},
    {key:'losses',     label:'L',         cell:m=>m.losses},
    {key:'winPct',     label:'Win%',      cell:m=>(m.winPct*100).toFixed(1)},
    {key:'pf',         label:'PF',        cell:m=>fmt(m.pf,0)},
    {key:'ppg',        label:'PPG',       cell:m=>fmt(m.ppg)},
    {key:'allPlayPct', label:'All-play%', cell:m=>m.allPlayPct===null?'—':(m.allPlayPct*100).toFixed(1)},
    {key:'luck',       label:'Luck',      cell:m=>m.luck===null?'—':`<span class="${m.luck>=0?'pos':'neg'}">${(m.luck>=0?'+':'')+(m.luck*100).toFixed(1)}</span>`},
    {key:'playoffs',   label:'Playoffs',  cell:m=>m.playoffs||''},
    {key:'titles',     label:'Titles',    cell:m=>`<span class="champ">${m.titles||''}</span>`}
  ];

  const t=el('table');
  const thead=el('thead'), trh=el('tr');
  trh.appendChild(el('th'));                       // rank column, not sortable
  cols.forEach(c=>{
    const th=el('th','sortable',esc(c.label));
    th.dataset.key=c.key;
    th.setAttribute('role','button');
    th.setAttribute('tabindex','0');
    if(ALLTIME_SORT.key===c.key){
      th.setAttribute('aria-sort', ALLTIME_SORT.dir===1?'ascending':'descending');
      th.innerHTML = esc(c.label) + (ALLTIME_SORT.dir===1?' ▲':' ▼');
    }
    const go=()=>{
      if(ALLTIME_SORT.key===c.key) ALLTIME_SORT.dir*=-1;
      else { ALLTIME_SORT.key=c.key; ALLTIME_SORT.dir = c.text ? 1 : -1; }
      renderAllTime();
    };
    th.addEventListener('click',go);
    th.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
    trh.appendChild(th);
  });
  thead.appendChild(trh); t.appendChild(thead);

  const col = cols.find(c=>c.key===ALLTIME_SORT.key) || cols[0];
  const rows = Object.values(STATE.managers).slice().sort((a,b)=>{
    let x=a[col.key], y=b[col.key];
    if(col.text) return String(x).localeCompare(String(y)) * ALLTIME_SORT.dir;
    // nulls (no all-play data) always sink to the bottom
    if(x===null||x===undefined) return 1;
    if(y===null||y===undefined) return -1;
    return (x-y) * ALLTIME_SORT.dir || b.pf-a.pf;
  });

  const tb=el('tbody');
  rows.forEach((m,i)=>{
    const tr=el('tr');
    tr.innerHTML = `<td class="rank">${i+1}</td>` +
      cols.map((c,ci)=>`<td class="${ci===0?'name':'num'}">${c.cell(m)}</td>`).join('');
    tb.appendChild(tr);
  });
  t.appendChild(tb); p.appendChild(t);
}

function renderBowls(p){

    const n = r.meetings.length;

    if(!n){
      body = `<div class="bowl-empty">No meetings on record yet.</div>`;

      const stat = (k,v) => v ? `<div class="bstat"><dt>${k}</dt><dd>${v}</dd></div>` : '';
      const when = m => `${m.season} wk ${m.week}${m.playoff?' · playoffs':''}`;

          <div class="bs-side"><div class="bs-name ${aLead?'lead':''}">${esc(r.a)}</div>
            <div class="bs-w ${aLead?'lead':''}">${r.aw}</div></div>
          <div class="bs-dash">—</div>
          <div class="bs-side r"><div class="bs-name ${bLead?'lead':''}">${esc(r.b)}</div>
            <div class="bs-w ${bLead?'lead':''}">${r.bw}</div></div>
        </div>
        <div class="bowl-series">${n} meeting${n===1?'':'s'}${r.t?` · ${r.t} tie${r.t===1?'':'s'}`:''} · ${aLead?esc(r.a)+' leads':bLead?esc(r.b)+' leads':'all square'}</div>
        <dl class="bowl-stats">
          ${stat('Points', `${fmt(r.apf,0)} — ${fmt(r.bpf,0)}`)}
          ${stat('Avg score', `${fmt(r.apf/n)} — ${fmt(r.bpf/n)}`)}
          ${stat('Biggest win', `${esc(r.biggest.winner||'tie')} by ${fmt(r.biggest.margin)}<span class="bwhen">${when(r.biggest)}</span>`)}
          ${stat('Highest combined', `${fmt(r.highest.total)}<span class="bwhen">${when(r.highest)}</span>`)}
          ${stat('Last meeting', `${esc(r.last.winner||'tie')} · ${fmt(r.last.ap)}–${fmt(r.last.bp)}<span class="bwhen">${when(r.last)}</span>`)}
          ${stat('Streak', r.streak ? `${esc(r.streak.who)} won ${r.streak.n}` : '')}
        </dl>`;
    }
    c.innerHTML = `<div class="bowl-head"><span class="bowl-name">${esc(r.name)}</span>
      ${r.sub?`<span class="bowl-sub">${esc(r.sub)}</span>`:''}</div>${body}`;
    return c;
  };

  bowls.filter(b=>b.featured).forEach(b => p.appendChild(draw(b)));
  const grid = el('div','bowl-grid');
  bowls.filter(b=>!b.featured).forEach(b => grid.appendChild(draw(b)));

function renderForecast(){
  const p=$('#p-forecast'); p.innerHTML='';
  const f=STATE.forecast;
  if(!f){ p.appendChild(el('div','empty','No current-season schedule available yet. Odds appear once Sleeper publishes the matchups.')); return; }

  p.appendChild(el('h2',null,`${f.season} playoff odds`));

  const state = f.weeksPlayed === 0
    ? `No games played yet. Every team starts at the league average of ${fmt(f.lgMean)} points per week, so these odds are driven only by the schedule — they are close to even by design. They start moving after week 1.`
    : `${f.weeksPlayed} week${f.weeksPlayed===1?'':'s'} played, ${f.weeksLeft} to go. ${f.sims.toLocaleString()} simulated seasons. Top ${f.spots} make the playoffs.`;
  p.appendChild(el('div','small muted',state));

  const t=el('table');
  t.innerHTML='<thead><tr><th></th><th>Manager</th><th>Record</th><th>PPG</th><th>Proj. wins</th><th>Avg seed</th><th>Top seed</th><th>Playoff odds</th></tr></thead>';
  const tb=el('tbody');
  f.rows.forEach((r,i)=>{
    const pct=(r.odds*100);
    const cls = pct>=75?'pos' : pct<=25?'neg' : '';
    const losses = r.games - r.wins;
    tb.innerHTML+=`<tr>
      <td class="rank">${i+1}</td>
      <td class="name">${esc(r.manager)}<div class="muted small">${esc(r.teamName)}</div></td>
      <td class="num">${r.games?`${r.wins}-${losses}`:'—'}</td>
      <td class="num">${r.ppg===null?'—':fmt(r.ppg)}</td>
      <td class="num">${fmt(r.projWins)}</td>
      <td class="num muted">${fmt(r.seed)}</td>
      <td class="num muted">${(r.top*100).toFixed(0)}%</td>
      <td class="num">
        <div class="oddsbar"><span style="width:${Math.max(pct,1.5)}%"></span></div>
        <span class="${cls}">${pct.toFixed(1)}%</span>
      </td></tr>`;
  });
  t.appendChild(tb); p.appendChild(t);

  p.appendChild(el('h3',null,'How this works'));
  const m=el('div','card small muted');
  m.innerHTML = `
    <p style="margin-top:0">Each team's weekly score is drawn from a normal distribution: its own mean, and a league-wide standard deviation of <b style="color:var(--paper)">${fmt(f.lgSD)}</b> points measured across every completed Sleeper season. The remaining schedule is the real one, so a hard run of opponents shows up in the odds without being modelled separately.</p>
    <p>A team's projected mean is not its raw average. Points per game is the best single predictor available, but it is unreliable over a handful of games, so the average is pulled toward the league mean of <b style="color:var(--paper)">${fmt(f.lgMean)}</b> — weighted as if the league average were ${f.K} extra games on the schedule. After three weeks a team is still mostly league-average; by week ten its own scoring dominates. Without that correction, a lucky week 1 would produce absurd forecasts.</p>
    <p style="margin-bottom:0">Not modelled: individual players, injuries, bye weeks, trades, or how good the draft was. So before the season starts these numbers carry no real information, and they are worth reading from about week 4 onward.</p>`;
  p.appendChild(m);
}

    card('Biggest blowout', fmt(r.blowout.margin), `${r.blowout.win} over ${r.blowout.lose} (${fmt(r.blowout.ws)}–${fmt(r.blowout.ls)})`, when(r.blowout));
    card('Closest game', fmt(r.close.margin,2), `${r.close.win} over ${r.close.lose}`, when(r.close));
    card('Highest-scoring loss', fmt(r.highLoss.points), `${r.highLoss.who}, beaten by ${r.highLoss.beatBy}`, when(r.highLoss));
    card('Lowest-scoring win', fmt(r.lowWin.points), r.lowWin.who, when(r.lowWin));
    card('Highest combined', fmt(r.combo.total), `${r.combo.a} vs ${r.combo.b}`, when(r.combo));
    p.appendChild(g);
  };

  group('Regular season', STATE.recReg);
  group('Playoffs', STATE.recPost, 'Championship and consolation bracket games only. Teams eliminated from both brackets are excluded — they are not playing, even though Sleeper still reports a score for them.');

  const rows=Object.values(STATE.managers).filter(m=>m.best).sort((a,b)=>b.best.points-a.best.points);
  if(rows.length) p.appendChild(el('h2',null,'Best single week, by manager'));
  if(rows.length) p.appendChild(el('div','small muted','Regular season only.'));
  const t=el('table');
  t.innerHTML='<thead><tr><th></th><th>Manager</th><th>Points</th><th>When</th></tr></thead>';
  const tb=el('tbody');
  rows.forEach((m,i)=>{
    tb.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(m.name)}</td>
      <td class="num">${fmt(m.best.points)}</td><td class="num muted">${m.best.season} wk ${m.best.week}</td></tr>`;
  });
  t.appendChild(tb); p.appendChild(t);

  // ---- scoring extremes ----
  const scorers = Object.values(STATE.managers)
    .filter(m => (m.wins+m.losses+m.ties) > 0 && m.ppg > 0)
    .sort((a,b)=>b.ppg-a.ppg);
  if(scorers.length >= 2){
    p.appendChild(el('h2',null,'Scoring, best and worst'));
    p.appendChild(el('div','small muted','Career points per game. Scoring rules changed between NFL.com and Sleeper, so managers with seasons in both eras are averaging across two different systems.'));
    const wrap=el('div','grid');
    const mkList=(title, list, cls)=>{
      const c=el('div','card');
      c.appendChild(el('h3',null,title));
      const tt=el('table');
      tt.innerHTML='<thead><tr><th></th><th>Manager</th><th>PPG</th><th>Yrs</th></tr></thead>';
      const tbb=el('tbody');
      list.forEach((m,i)=>{
        tbb.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(m.name)}</td>
          <td class="num ${cls}">${fmt(m.ppg)}</td><td class="num muted">${m.seasons}</td></tr>`;
      });
      tt.appendChild(tbb); c.appendChild(tt);
      wrap.appendChild(c);
    };
    mkList('Top 3 — points per game', scorers.slice(0,3), 'cons');
    mkList('Bottom 3 — points per game', scorers.slice(-3).reverse(), 'shame-last');
    p.appendChild(wrap);
  }

  // ---- postseason ----
  p.appendChild(el('h2',null,'Postseason'));
  p.appendChild(el('div','small muted','Playoff appearances and podium finishes. Playoff counts come from the championship bracket, so they only cover seasons where one was played.'));
  const post = Object.values(STATE.managers)
    .filter(m => m.playoffs || m.titles || m.seconds || m.thirds)
    .sort((a,b)=> b.titles-a.titles || b.seconds-a.seconds || b.thirds-a.thirds || b.playoffs-a.playoffs);
  if(!post.length){
    p.appendChild(el('div','empty','No completed brackets yet.'));
  } else {
    const tp=el('table');
    tp.innerHTML='<thead><tr><th></th><th>Manager</th><th>Playoffs</th><th>1st</th><th>2nd</th><th>3rd</th><th>Podium</th></tr></thead>';
    const tbp=el('tbody');
    post.forEach((m,i)=>{
      const podium=m.titles+m.seconds+m.thirds;
      tbp.innerHTML+=`<tr><td class="rank">${i+1}</td><td class="name">${esc(m.name)}</td>
        <td class="num">${m.playoffs||''}</td>
        <td class="num champ">${m.titles||''}</td>
        <td class="num">${m.seconds||''}</td>
        <td class="num">${m.thirds||''}</td>
        <td class="num">${podium||''}</td></tr>`;
    });
    tp.appendChild(tbp); p.appendChild(tp);

    const never = Object.values(STATE.managers).filter(m => !m.playoffs && m.seasons);
    if(never.length){
      p.appendChild(el('div','small muted','Never made the playoffs: ' + never.map(m=>esc(m.name)).join(' &middot; ')));
    }
  }

  // ---- consolation bracket ----
  const cons = STATE.seasons.filter(s=>s.consolationWinner).sort((a,b)=>b.season-a.season);
  if(cons.length){
    p.appendChild(el('h2',null,'Consolation bracket'));
    p.appendChild(el('div','small muted','Winners of the losers bracket — the best of the teams that missed the playoffs.'));
    const t3=el('table');
    t3.innerHTML='<thead><tr><th>Season</th><th>Consolation winner</th><th>Beat</th></tr></thead>';
    const tb3=el('tbody');
    cons.forEach(s=>{
      tb3.innerHTML+=`<tr><td class="name num">${s.season}</td>
        <td style="text-align:right" class="cons">${esc(s.consolationWinner)}</td>
        <td class="muted">${esc(s.consolationRunnerUp||'—')}</td></tr>`;
    });
    t3.appendChild(tb3); p.appendChild(t3);

    const multi = Object.values(STATE.managers).filter(m=>m.consolations>1)
      .sort((a,b)=>b.consolations-a.consolations);
    if(multi.length){
      p.appendChild(el('div','small muted','Multiple consolation titles: '
        + multi.map(m=>`${esc(m.name)} (${m.consolations})`).join(', ')));
    }
  }
}

function renderDrafts(){
  const p=$('#p-drafts'); p.innerHTML='';
  const ds=STATE.seasons.filter(s=>s.draft.length).sort((a,b)=>b.season-a.season);
  if(!ds.length){ p.appendChild(el('div','empty','No draft data yet. Sleeper drafts appear here once a draft completes.')); return; }
  const ctr=el('div','controls'); const sel=el('select');
  ds.forEach(s=>{const o=el('option',null,String(s.season)); o.value=s.season; sel.appendChild(o);});
  ctr.appendChild(sel); p.appendChild(ctr);
  const box=el('div'); p.appendChild(box);
  const draw=()=>{
    const s=ds.find(x=>x.season===+sel.value); box.innerHTML='';
    box.appendChild(el('h2',null,`${s.season} draft`));
    const t=el('table');
    t.innerHTML='<thead><tr><th>Pick</th><th>Manager</th><th>Player</th><th>Pos</th><th>Team</th></tr></thead>';
    const tb=el('tbody');
    s.draft.slice().sort((a,b)=>a.pick-b.pick).forEach(pk=>{
      tb.innerHTML+=`<tr><td class="rank">${pk.round}.${String(pk.pick).padStart(2,'0')}</td>
        <td class="name">${esc(pk.manager)}</td><td style="text-align:right">${esc(pk.player)}</td>
        <td class="num muted">${esc(pk.position)}</td><td class="num muted">${esc(pk.team)}</td></tr>`;
    });
    t.appendChild(tb); box.appendChild(t);
  };
  sel.addEventListener('change',draw); draw();
}

function renderData(){
  const p=$('#p-data'); p.innerHTML='';
  p.appendChild(el('h2',null,'What is loaded'));
  const t=el('table');
  t.innerHTML='<thead><tr><th>Season</th><th>Source</th><th>Teams</th><th>Weeks</th><th>Draft picks</th><th>Champion</th></tr></thead>';
  const tb=el('tbody');
  STATE.seasons.slice().sort((a,b)=>b.season-a.season).forEach(s=>{
    tb.innerHTML+=`<tr><td class="name num">${s.season}</td><td style="text-align:right">${s.source}</td>
      <td class="num">${s.teamCount}</td><td class="num">${s.weeks.length}</td>
      <td class="num">${s.draft.length}</td><td>${esc(s.champion||'—')}</td></tr>`;
  });
  const now=new Date().getFullYear();
  for(let y=CONFIG.firstSeason;y<=now;y++){
    if(!STATE.seasons.find(s=>s.season===y))
      tb.innerHTML+=`<tr><td class="name num" style="color:var(--ghost)">${y}</td><td colspan="5" class="muted" style="text-align:right">not recovered</td></tr>`;
  }
  t.appendChild(tb); p.appendChild(t);

  p.appendChild(el('h2',null,'Adding the NFL.com years'));
  const d=el('div','card small');
  d.innerHTML=`<p style="margin-top:0">Open this file in a text editor and fill in <code>MANUAL_HISTORY</code> near the top. One block per season:</p>
<pre>{
  season: 2019,
  teams: [
    { manager:'Francesco', wins:9, losses:5, ties:0, pf:1587.2, pa:1440.8, finish:3 }
  ],
  notes: '14 teams, half-PPR'
}</pre>
<p>Add what you know and leave the rest — a season with only final records still counts toward all-time standings and turns its bar solid up top. <code>finish:1</code> marks the champion.</p>
<p style="margin-bottom:0">If two team names belong to the same person, map them in <code>IDENTITY</code> so their all-time record stays in one row.</p>`;
  p.appendChild(d);

  p.appendChild(el('h2',null,'How this page gets its data'));
  const d2=el('div','card small muted');
  d2.innerHTML=`<p style="margin-top:0">Sleeper seasons are fetched live from <code>api.sleeper.app</code> every time the page loads, walking backwards through <code>previous_league_id</code> from the current league. Nothing is cached and nothing is stored — refresh and you have current standings.</p>
  <p style="margin-bottom:0">That also means this page needs an internet connection, and the Sleeper half updates itself for free as new seasons are played.</p>`;
  p.appendChild(d2);
}

/* ---------- header from config ---------- */
$('#eyebrow').textContent = CONFIG.eyebrow;
$('#tagline').textContent = CONFIG.tagline;
if(CONFIG.logo){
  const lg=$('#logo');
  lg.src=CONFIG.logo; lg.alt=CONFIG.leagueName+' logo'; lg.hidden=false;
  lg.addEventListener('error',()=>{ lg.hidden=true; console.warn('Logo not found:',CONFIG.logo); });
}

/* ---------- tabs ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    $('#p-'+b.dataset.p).classList.add('on');
  });
});

/* ---------- boot ---------- */
(async function(){
  try{
    const sleeper = await loadSleeper();
    const manual  = buildManual();
    const seen = new Set(sleeper.map(s=>s.season));
    STATE.seasons = sleeper.concat(manual.filter(m=>!seen.has(m.season))).sort((a,b)=>a.season-b.season);

    STATE.managers = buildManagers(STATE.seasons);
    STATE.h2h      = buildH2H(STATE.seasons);
    STATE.rivalries= buildRivalries(STATE.seasons);
    STATE.records  = buildRecords(STATE.seasons,'all');
    STATE.recReg   = buildRecords(STATE.seasons,'reg');
    STATE.recPost  = buildRecords(STATE.seasons,'post');
    STATE.forecast = buildForecast();
    STATE.shame    = buildShame(STATE.seasons);
    STATE.loaded   = true;

    renderStrip(); renderOverview(); renderSeasons(); renderMatchups();
    renderAllTime(); renderH2H(); renderRecords(); renderForecast(); renderShame(); renderDrafts(); renderData();

    const sl=STATE.seasons.filter(s=>s.source==='sleeper').length;
    const mn=STATE.seasons.length-sl;
    setStatus(`Loaded ${sl} Sleeper season${sl===1?'':'s'}${mn?` and ${mn} manual`:''}. Last refreshed ${new Date().toLocaleString()}.`);

    if(UNRESOLVED.length){
      const byOwner = {};
      UNRESOLVED.forEach(u => (byOwner[u.ownerId] = byOwner[u.ownerId] || []).push(u));
      console.log('%c' + UNRESOLVED.length + ' roster(s) have no name. Paste these into IDENTITY '
        + 'and delete any "Unclaimed roster N" lines:', 'color:#F2A33C;font-weight:600');
      console.log(Object.entries(byOwner).map(([id,list]) =>
        `  '${id}' : 'NAME_HERE',   // ${list[0].teamName} — roster `
        + `${list.map(l=>l.rosterId).join('/')} in ${list.map(l=>l.season).join(', ')}`
        + ` — record ${list[0].record}`
      ).join('\n'));
    }
  }catch(e){
    console.error(e);
    setStatus('Could not reach the Sleeper API: '+e.message+'. Check the league ID in CONFIG, then reload.', true);
  }
})();
</script>
